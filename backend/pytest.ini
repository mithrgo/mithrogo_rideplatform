[pytest]
DJANGO_SETTINGS_MODULE = config.settings
python_files = test_*.py
testpaths = tests
env =
    DJANGO_SECRET_KEY=test-only-secret-key-that-is-long-enough-for-hs256-signing
    DJANGO_DEBUG=1
    PAYMENT_WEBHOOK_SECRET=test-webhook-secret
    SQLITE_PATH=:memory:
    POSTGRES_DB=
    OTP_SEND_THROTTLE=1000/min
    OTP_VERIFY_THROTTLE=1000/min
addopts = -q
